syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.sample";
option java_outer_classname = "Sample";

package com.example.sample;

message HelloRequest {
  int32 code = 1;
  string message = 2;
  ReqBody data = 3;
}

message ReqBody {
  string name = 1;
  int32 num = 2;
}

message HelloReply {
  string message = 1;
}